    '@nuxt/eslint-config': ^1.17.0
    '@nuxt/fonts': ^1.2.0
    '@nuxt/icon': ^2.6.3
    '@nuxt/scripts': ^2.0.0-beta.16
    '@nuxtjs/color-mode': ^4.1.0
    '@openpanel/nuxt': ^0.4.4
    '@tailwindcss/vite': ^4.3.5
    '@types/node': ^26.6.6
    '@vueuse/core': ^15.0.0
    '@vueuse/nuxt': ^15.0.0
    class-variance-authority: ^0.7.1
    clsx: ^2.1.1
    eslint: ^10.15.0
    eslint-plugin-better-tailwindcss: ^4.11.0
    eslint-plugin-oxlint: ^1.94.0
    husky: ^9.1.7
    is-ci: ^4.1.0
    lint-staged: ^17.6.2
    '@lucide/vue': ^1.77.0
    maplibre-gl: ^6.19.0
    motion-v: ^2.13.0
    nuxt: ^4.6.4
    oxfmt: ^0.79.0
    oxlint: ^1.94.0
    radix-vue: ^1.9.17
    reka-ui: ^2.11.0
    shadcn-nuxt: ^2.9.0
    tailwind-merge: ^3.7.1
    tailwindcss: ^4.3.5
    tailwindcss-animate: ^1.0.7
    tw-animate-css: ^1.4.0
    typescript: ^6.0.3
    vite: ^8.3.8
    vitest: ^5.1.1
    # Exact pin: a caret on a prerelease lets pnpm resolve a second Vue copy.
    # The overrides below force every package onto this one release.
    vue: 3.6.0-rc.15
    vue-tsc: ^3.3.14
  client:
    '@comark/nuxt': ^0.9.2
    '@geoql/v-maplibre': ^3.1.2
    '@maplibre/mlt': ^1.3.0
    '@mlc-ai/web-llm': ^0.2.89
    '@tanstack/ai': ^1.4.0
    '@tanstack/ai-vue': ^1.1.1
    '@tanstack/query-db-collection': ^1.5.2
