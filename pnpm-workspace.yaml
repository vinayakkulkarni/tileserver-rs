packages:
  - apps/client
  - apps/docs
  - apps/marketing
  - benchmarks

# pnpm's supply-chain policy defaults to a 24-hour minimumReleaseAge,
# which blocks legitimate routine dep bumps when CI runs within a day of
# an upstream patch release (e.g. cloudflare/wrangler, cloudflare/miniflare).
# 60 minutes still prevents publish-and-pivot attacks but unblocks normal flow.
minimumReleaseAge: 60

# First-party packages published by geoql (e.g. maplibre-gl-inspect) are exempt
# from the age gate — publishing a fix for our own package must not be blocked
# by our own supply-chain policy (same pattern as @oxlint/* in geoql/doctor).
minimumReleaseAgeExclude:
  - maplibre-gl-inspect

# pnpm blocks all package build scripts by default. The allowBuilds
# map below is security-sensitive — true = postinstall runs; false = skipped.
# Warning: pnpm auto-manages this block. Edits made while pnpm install is
# running may be clobbered. If you see an autogenerated duplicate allowBuilds
# block, remove the duplicate and keep THIS one as source of truth.
#   - better-sqlite3: native SQLite binding used by @nuxt/content (apps/docs)
#   - esbuild: Vite/Nuxt bundler, verifies prebuilt binary matches platform
#   - sharp: image processing for @nuxt/fonts OG image generation
#   - unrs-resolver: Nuxt 4 module resolver, rust-native platform-specific
#   - workerd: Cloudflare Workers runtime used by apps/marketing wrangler
#   - @parcel/watcher: falls back to polling; safe to skip native build
#   - vue-demi: alias/symlink script; not required at runtime
allowBuilds:
  '@parcel/watcher': false
  # better-sqlite3: prebuilt binaries ship in the tarball (prebuilds/<platform>-<arch>.node
  # for linux-x64/arm64, darwin, win32 — loaded via lib/binding.js at runtime). pnpm's
  # gypfile auto-detection injects `node-gyp rebuild` when true, which fails in the
  # Docker node-builder stage (node:26-slim has no Python). Keep false to skip the
  # unnecessary rebuild; the prebuilds work at runtime.
  better-sqlite3: false
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: false
  workerd: true

# Catalogs are referenced from workspace packages as `catalog:default`
# (or shorthand `catalog:` for the default). Keep `catalog:default` refs in
# package.json files to match the pre-existing Bun catalog syntax — pnpm
