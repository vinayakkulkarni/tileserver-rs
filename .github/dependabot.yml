version: 2
updates:
  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "00:00"
    assignees:
      - vinayakkulkarni
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope

  # Cargo (Rust)
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: daily
      time: "00:00"
    assignees:
      - vinayakkulkarni
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    # OpenTelemetry crates MUST bump together. The five SDK/OTLP/tracing
    # crates share an opentelemetry_sdk trait surface (MetricReader); when
    # they drift across minor versions the `opentelemetry-prometheus` reader
    # implements the trait from one version and the meter provider expects
    # another, breaking clippy with a `trait bound … not satisfied` error.
    # Hit on PRs #885 #888 #893 #895 in May 2026 — Dependabot bumped them
    # solo, CI red, manual revert each time. Grouping forces a single PR
    # we can land/revert atomically. arrow-* are grouped for the same
    # reason (parquet pins them transitively).
    groups:
      opentelemetry:
        patterns:
          - "opentelemetry"
          - "opentelemetry_sdk"
          - "opentelemetry-*"
          - "tracing-opentelemetry"
      arrow:
        patterns:
          - "arrow-*"
          - "parquet"

  # npm ecosystem covers the pnpm workspace (apps/client + apps/docs +
  # apps/marketing + benchmarks via pnpm-workspace.yaml packages list).
  # Dependabot's `package-ecosystem: pnpm` is NOT supported yet — tracked in
  # dependabot-core#14794 (opened Apr 22 2026, feature-request). Meanwhile the
  # `npm` ecosystem auto-detects pnpm-lock.yaml and atomically updates BOTH
  # package.json AND pnpm-lock.yaml in the same PR (pnpm catalog support
  # went GA in Feb 2025 under the npm ecosystem).
  # Ref: https://github.blog/changelog/2025-02-04-dependabot-now-supports-pnpm-workspace-catalogs-ga/
  # Ref: https://github.com/dependabot/dependabot-core/issues/14794
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
      time: "00:00"
    assignees:
      - vinayakkulkarni
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope

