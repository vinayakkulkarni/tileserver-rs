name: "Release (Sample Data)"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v2.12.1)"
        required: true
        type: string
  push:
    tags:
      - "v*"

jobs:
  package:
    name: Package sample data
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Package sample data
        run: |
          # Package data/ directory (tiles, styles, fonts, raster)
          # Excludes .DS_Store and other OS artifacts
          tar -czvf tileserver-rs-sample-data.tar.gz \
            --exclude='.DS_Store' \
            --exclude='*.swp' \
            -C data \
            tiles styles fonts raster
          sha256sum tileserver-rs-sample-data.tar.gz > tileserver-rs-sample-data.tar.gz.sha256
          echo "Archive contents:"
          tar -tzvf tileserver-rs-sample-data.tar.gz | head -20
          echo "---"
          ls -lh tileserver-rs-sample-data.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tileserver-rs-sample-data
          path: |
            tileserver-rs-sample-data.tar.gz
            tileserver-rs-sample-data.tar.gz.sha256
          retention-days: 30

      # gh release upload, not softprops/action-gh-release: on an existing
      # release, softprops v3 PATCHes the release and resends target_commitish.
      # GitHub rejects that from GITHUB_TOKEN (403 "Resource not accessible by
      # integration") when the tag's .github/workflows differ from main's, so
      # every backfill (workflow_dispatch from main) failed after the build.
      # release-please already created the release; this only adds assets.
      # https://github.com/softprops/action-gh-release/issues/836
      - name: Upload to release
        run: |
          gh release upload "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            "tileserver-rs-sample-data.tar.gz" \
            "tileserver-rs-sample-data.tar.gz.sha256"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
