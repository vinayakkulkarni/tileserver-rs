name: "Release macOS Binaries"

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v2.4.0)"
        required: true
        type: string

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build macOS ${{ matrix.arch }}
    # macos-latest (arm64), never a numbered image: GitHub retires macOS
    # images on its own schedule (macos-14 was retired 2026-11-02 and jobs on
    # it failed in 1 second with "macos-14-arm64-us-default is not supported",
    # so v2.41.2-v2.41.4 shipped no macOS binary). `latest` follows the move
    # instead of breaking on it. The trade-off: the image can change without
    # a commit here, so the "Verify deployment target" step below fails the
    # build if the SDK ever raises the binary's minimum macOS.
    # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            # AMD64 disabled — Intel macOS runners retired, cross-compile complex
            # Uncomment when solution found:
            # - arch: amd64
            #   target: x86_64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install build dependencies
        run: brew install libuv pkg-config gdal

      - name: Download pre-built MapLibre Native
        run: |
          MBGL_VERSION=$(grep '^version' crates/mbgl-sys/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          URL="https://github.com/${{ github.repository }}/releases/download/mbgl-sys-v${MBGL_VERSION}/mbgl-native-${{ matrix.target }}.tar.gz"
          echo "Downloading mbgl-sys v${MBGL_VERSION} for ${{ matrix.target }}..."

          MAX_RETRIES=5
          DELAY=60
          for i in $(seq 1 $MAX_RETRIES); do
            if curl -fSL "$URL" | tar xz; then
              echo "✅ Download successful"
              ls -lh lib/
              exit 0
            fi
            if [ "$i" -lt "$MAX_RETRIES" ]; then
              echo "⏳ Attempt $i/$MAX_RETRIES failed, waiting ${DELAY}s before retry..."
              sleep $DELAY
            fi
          done
          echo "❌ Failed to download native binaries after $MAX_RETRIES attempts"
          exit 1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.arch }}


      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build client
        run: |
          ulimit -s unlimited 2>/dev/null || true
          cd apps/client
          pnpm exec nuxi generate
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Build Rust binary
        run: cargo build --release --target ${{ matrix.target }} --features frontend
        env:
          MBGL_SYS_LIB_DIR: ${{ github.workspace }}/lib

      - name: Prepare release
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/tileserver-rs dist/tileserver-rs
          chmod +x dist/tileserver-rs
          cd dist
          tar -czvf tileserver-rs-${{ matrix.target }}.tar.gz tileserver-rs
          shasum -a 256 tileserver-rs-${{ matrix.target }}.tar.gz > tileserver-rs-${{ matrix.target }}.tar.gz.sha256

      - name: Verify deployment target
        run: |
          # The binary must stay runnable on the oldest macOS we support.
          # Rust defaults to 11.0 unless a build raises it; this fails loudly
          # if a future macos-latest image does.
          MINOS=$(otool -l dist/tileserver-rs | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit}')
          echo "Mach-O minimum macOS: ${MINOS}"
          case "${MINOS}" in
            11.*) echo "OK" ;;
            *) echo "::error::minimum macOS moved to ${MINOS} (expected 11.x)"; exit 1 ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tileserver-rs-${{ matrix.target }}
          path: |
            dist/tileserver-rs-${{ matrix.target }}.tar.gz
            dist/tileserver-rs-${{ matrix.target }}.tar.gz.sha256
          retention-days: 30

      # gh release upload, not softprops/action-gh-release: on an existing
      # release, softprops v3 PATCHes the release and resends target_commitish.
      # GitHub rejects that from GITHUB_TOKEN (403 "Resource not accessible by
      # integration") when the tag's .github/workflows differ from main's, so
      # every backfill (workflow_dispatch from main) failed after the build.
      # release-please already created the release; this only adds assets.
      # https://github.com/softprops/action-gh-release/issues/836
      - name: Upload to release
        run: |
          gh release upload "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            "dist/tileserver-rs-${{ matrix.target }}.tar.gz" \
            "dist/tileserver-rs-${{ matrix.target }}.tar.gz.sha256"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
