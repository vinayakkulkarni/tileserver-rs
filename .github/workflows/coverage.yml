name: 'Coverage (Rust)'

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  CI: 1

jobs:
  coverage:
    name: Code Coverage (${{ matrix.group }})
    # Pinned to ubuntu-24.04, not ubuntu-latest: the prebuilt MapLibre Native
    # archive (mbgl-sys) is built against Ubuntu 24.04's ICU 74, the Docker
    # image and the arm64 runners are 24.04 too. ubuntu-latest moved to 26.04
    # (ICU 76) in Oct 2026 and linking failed with undefined icu_74 symbols.
    runs-on: ubuntu-24.04
    # The feature combos used to run one after another in one job (~47 min).
    # Each group now runs in its own job; Codecov merges every upload for the
    # commit into one report, so the totals and the 75% gate are unchanged.
    timeout-minutes: 45
    # PostGIS only for the `core` group, which runs the live PostGIS tests. An
    # empty image skips the service in the other groups.
    services:
      postgis:
        image: ${{ matrix.group == 'core' && 'postgis/postgis:17-3.5' || '' }}
        env:
          POSTGRES_USER: tileserver
          POSTGRES_PASSWORD: tileserver
          POSTGRES_DB: tiles
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tileserver -d tiles"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://tileserver:tileserver@localhost:5432/tiles
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core
            run: >-
              cargo llvm-cov --no-report --lib --test metrics_endpoint --test api_endpoints --test common_smoke --test http_sources --test pmtiles_local --test integration --test route_core --test route_data --test route_styles --test route_render --test route_fonts --test route_files --test route_og --test route_embed --test route_composite --test route_style_autogen --test route_spatial --test route_ogc --test route_admin_upload --test route_admin_config_schema --test admin_stats --test live_updates --test postgres_sources --test postgis_live --test route_llm_proxy --no-default-features --features "postgres,postgres-integration,mlt,cel" && cargo llvm-cov --no-report --lib --test postgis_live --no-default-features --features "postgres,postgres-integration,raster" && cargo llvm-cov --no-report --lib --no-default-features --features "postgres,postgres-integration,mcp" -- mcp::handlers::postgis_tests
          - group: mcp
            run: >-
              cargo llvm-cov --no-report --lib --test route_mcp_http --test route_mcp_stdio --test route_mcp_oauth --test route_mcp_handlers --test route_admin_oauth --no-default-features --features "mcp" && cargo llvm-cov --no-report --lib --test route_admin_oauth --no-default-features --features "mcp,mcp-persistence"
          - group: duckdb
            run: >-
              cargo llvm-cov --no-report --lib --no-default-features --features "duckdb"
          - group: geoparquet
            run: >-
              cargo llvm-cov --no-report --lib --no-default-features --features "geoparquet"
          - group: gdal
            run: >-
              cargo llvm-cov --no-report --lib --test raster_sources --no-default-features --features "raster" && cargo llvm-cov --no-report --lib --no-default-features --features "stac" && cargo llvm-cov --no-report --lib --test dem_sources --no-default-features --features "dem"
          - group: sftp
            run: >-
              cargo llvm-cov --no-report --lib --no-default-features --features "sftp"

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # ubuntu-latest ships with ~14GB free on /; the duckdb combo alone
      # (libduckdb-sys produces ~6GB of object files) exceeds that.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          preinstalled-runtimes: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # libgdal-dev + libclang-dev are required by gdal-sys (bindgen) for the
      # raster / stac / dem combos.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libclang-dev \
            libgdal-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: coverage-${{ matrix.group }}

      - name: Drop incomplete DuckDB source trees
        # libduckdb-sys 1.20000.1 unpacks its sources once into
        # target/**/duckdb-sources/<hash> and marks the tree with a COMPLETE file.
        # rust-cache's target cleanup deletes that file, so a restored tree has no
        # marker and the build script fails with "Directory not empty"
        # (duckdb/duckdb-rs#935). Fixed upstream in duckdb/duckdb-rs#936, not yet
        # released; remove this step once libduckdb-sys > 1.20000.1 ships.
        shell: bash
        run: find target -type d -name duckdb-sources -prune -exec rm -rf {} + 2>/dev/null || true

      - name: Load PostGIS fixtures
        if: matrix.group == 'core'
        run: .github/scripts/load-postgis-fixtures.sh

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Clean coverage artifacts
        run: cargo llvm-cov clean --workspace

      # IMPORTANT: cargo-llvm-cov only instruments the test binaries it is told
      # about. When you add a tests/route_*.rs (or any non-gated integration
      # test), add it to the matching group's --test list above.
      - name: Coverage (${{ matrix.group }})
        run: ${{ matrix.run }}

      - name: Generate coverage report
        run: |
          cargo llvm-cov report \
            --codecov \
            --output-path codecov.json \
            --ignore-filename-regex "(vendor|build\.rs)"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: codecov.json
          flags: unittests
          name: tileserver-rs-${{ matrix.group }}
          fail_ci_if_error: false
