name: 'Coverage (Rust)'

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  CI: 1

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    # 7 feature combos run sequentially as instrumented llvm-cov builds; the
    # GDAL-heavy raster + stac combos land last. After the free-disk-space fix
    # unblocked the duckdb combo, total wall-clock crept past the old 45-min cap
    # (job was ~95% done, cancelled mid-stac). 60 min gives headroom; if it
    # recurs, split GDAL vs non-GDAL combos into two parallel jobs.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # ubuntu-latest ships with ~14GB free on /. The coverage job runs every
      # feature combo sequentially, accumulating llvm-cov instrumented artifacts
      # in target/llvm-cov-target/; the duckdb combo alone (libduckdb-sys
      # produces ~6GB of object files before archiving) then exceeds the disk.
      # Clearing pre-installed Android SDK / .NET / Haskell / large-packages
      # reclaims ~30GB and unblocks the archive step (ar: No space left on
      # device). Mirrors the same step in ci-rust.yml.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install system dependencies
        # libgdal-dev + libclang-dev are required by gdal-sys (bindgen) when
        # compiling the `raster` and `stac` feature combos. Other combos
        # (postgres, mlt, duckdb, geoparquet) are pure Rust and don't need
        # apt deps, but installing once for all combos keeps the matrix simple.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libclang-dev \
            libgdal-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: coverage

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Clean coverage artifacts
        run: cargo llvm-cov clean --workspace

      - name: Coverage — postgres + mlt (lib + integration tests)
        run: |
          cargo llvm-cov \
            --no-report \
            --lib \
            --test metrics_endpoint \
            --test api_endpoints \
            --test common_smoke \
            --test route_core \
            --test route_data \
            --test route_styles \
            --test route_render \
            --test route_admin_upload \
            --test route_admin_config_schema \
            --no-default-features \
            --features "postgres,mlt"

      - name: Coverage — mcp
        # IMPORTANT: list EVERY mcp integration test file here. cargo-llvm-cov
        # only instruments tests it knows about, so omitting any mcp test file
        # silently drops its contribution and codecov under-reports the matching
        # source module by 30+ points. Add new tests/route_mcp_*.rs and
        # tests/route_admin_oauth*.rs files to this list when you create them.
        run: |
          cargo llvm-cov \
            --no-report \
            --lib \
            --test route_mcp_http \
            --test route_mcp_stdio \
            --test route_mcp_oauth \
            --test route_mcp_handlers \
            --test route_admin_oauth \
            --no-default-features \
            --features "mcp"

      - name: Coverage — mcp + mcp-persistence (SQLite OAuth backend)
        # mcp-persistence activates the SqliteStore branch in src/mcp/auth_store_sqlite.rs.
        # The sqlite-only tests inside route_admin_oauth.rs are gated on
        # #[cfg(feature = "mcp-persistence")], so this is the only step that
        # exercises that code path. Omitting it drops sqlite store coverage to 0%.
        run: |
          cargo llvm-cov \
            --no-report \
            --lib \
            --test route_admin_oauth \
            --no-default-features \
            --features "mcp,mcp-persistence"

      - name: Coverage — duckdb
        run: |
          cargo llvm-cov \
            --no-report \
            --lib \
            --no-default-features \
            --features "duckdb"

      - name: Coverage — geoparquet
        run: |
          cargo llvm-cov \
            --no-report \
            --lib \
            --no-default-features \
            --features "geoparquet"

      - name: Coverage — raster
        run: |
          cargo llvm-cov \
            --no-report \
            --lib \
            --no-default-features \
            --features "raster"

      - name: Coverage — stac
        run: |
          cargo llvm-cov \
            --no-report \
            --lib \
            --no-default-features \
            --features "stac"

      - name: Generate merged coverage report
        run: |
          cargo llvm-cov report \
            --codecov \
            --output-path codecov.json \
            --ignore-filename-regex "(vendor|build\.rs)"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: codecov.json
          flags: unittests
          name: tileserver-rs
          fail_ci_if_error: false

  # Complexity-vs-coverage (CRAP) gate. Consumes the --all-features LCOV that
  # ci-rust.yml already produced (no second instrumented build here) and reports
  # the worst offenders. Advisory for now (continue-on-error) — flip off once a
  # main baseline is committed and switch to --baseline + regression gating.
  crap:
    name: Complexity (CRAP)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-crap
        run: cargo install cargo-crap --locked

      - name: Download all-features LCOV
        uses: actions/download-artifact@v8
        with:
          name: lcov-all-features

      - name: Run cargo-crap
        # `|| true` keeps this advisory: the report is still written + posted
        # even when functions exceed the threshold (cargo-crap exits non-zero).
        run: |
          cargo crap --path crates/tileserver-rs \
            --lcov lcov-all-features.info \
            --exclude 'tests/**' --exclude 'benches/**' \
            --allow 'crates/mbgl-sys/**' \
            --threshold 30 \
            --format pr-comment \
            --repo-url "${{ github.server_url }}/${{ github.repository }}" \
            --commit-ref "${{ github.event.pull_request.head.sha || github.sha }}" \
            --output crap-report.md || true

      - name: Post CRAP report as PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: cargo-crap
          path: crap-report.md
