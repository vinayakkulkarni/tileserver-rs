[package]
name = "tileserver-rs"
version = "2.28.0"
edition.workspace = true
rust-version.workspace = true
authors = ["Vinayak Kulkarni <inbox.vinayak@gmail.com>"]
description = "Tileserver for serving vector maps from data source(s)"
license-file = "../../LICENSE"
readme = "../../README.md"
repository.workspace = true
keywords = ["pmtiles", "mbtiles", "gis", "vector-tiles", "tileserver"]
publish = false

[lints]
workspace = true

[dependencies]
mbgl-sys         = { workspace = true }
anyhow           = { workspace = true }
arc-swap         = { workspace = true }
async-trait      = { workspace = true }
axum             = { workspace = true }
bytes            = { workspace = true }
clap             = { workspace = true }
dotenvy          = { workspace = true }
futures          = { workspace = true }
image            = { workspace = true }
mime_guess       = { workspace = true }
pmtiles          = { workspace = true }
reqwest          = { workspace = true }
shellexpand      = { workspace = true }
rust-embed       = { workspace = true, optional = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
sha2             = { workspace = true }
thiserror        = { workspace = true }
geozero          = { workspace = true }
flate2           = { workspace = true }
# MLT (MapLibre Tiles) transcoding support (optional)
mlt-core         = { workspace = true, optional = true }
prost            = { workspace = true, optional = true }
geo-types        = { workspace = true, optional = true }
tokio            = { workspace = true }
crossbeam-channel = { workspace = true }
toml             = { workspace = true }
tower-http       = { workspace = true }
urlencoding      = { workspace = true }
uuid             = { workspace = true }
tracing          = { workspace = true }
tracing-subscriber = { workspace = true }

# OpenAPI / Scalar API Reference (bundled, no external dependencies)
utoipa           = { workspace = true }
scalar_api_reference = { workspace = true }

# OpenTelemetry
opentelemetry    = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry-prometheus = { workspace = true }
prometheus = { workspace = true }

# MBTiles support (SQLite)
rusqlite         = { workspace = true }

# Raster/COG support (optional, requires GDAL system library)
gdal             = { workspace = true, optional = true }
stac             = { workspace = true, optional = true }
ndarray          = { workspace = true, optional = true }
exmex            = { workspace = true, optional = true }

# PostgreSQL support (optional)
deadpool-postgres = { workspace = true, optional = true }
tokio-postgres   = { workspace = true, optional = true }
postgres-types   = { workspace = true, optional = true }
semver           = { workspace = true, optional = true }
moka             = { workspace = true }
ogcapi-types     = { workspace = true, optional = true }
geojson          = { workspace = true, optional = true }
cql2             = { workspace = true, optional = true }

# Cloud object storage (S3/Azure/GCS)
object_store     = { workspace = true, optional = true }
url              = { workspace = true, optional = true }

# GeoParquet support (optional)
parquet          = { workspace = true, optional = true }
arrow-array      = { workspace = true, optional = true }
arrow-schema     = { workspace = true, optional = true }
arrow-cast       = { workspace = true, optional = true }
geo              = { workspace = true, optional = true }

# DuckDB support (optional)
duckdb           = { workspace = true, optional = true }

# MCP (Model Context Protocol) server support (optional)
#
# Pulls rmcp with its `default` features (base64 + macros + server, where
# `server` itself enables `dep:schemars` for JSON Schema generation) plus
# the two transports we expose: stdio (`transport-io`) for local clients
# like Claude Desktop and Streamable HTTP for remote clients (Cursor, MCP
# Inspector, claude.ai via mcp-remote bridges).
rmcp             = { version = "1.7", optional = true, features = ["transport-io", "transport-streamable-http-server"] }
schemars         = { version = "1", optional = true }
base64           = { version = "0.22", optional = true }

# OAuth 2.0 support for the MCP HTTP transport (RFC 7591 DCR + claude.ai
# Custom Connectors). Pulled in only when both `mcp` and the operator's
# `[mcp.oauth]` block opt into OAuth — see `src/mcp/auth.rs`. JWT access
# tokens are signed with RS256.
jsonwebtoken     = { version = "10", optional = true, default-features = false, features = ["rust_crypto", "use_pem"] }
askama           = { version = "0.15", optional = true }
serde_urlencoded = { version = "0.7", optional = true }
rsa              = { version = "0.9", optional = true, features = ["pem"] }

[features]
default = ["postgres", "raster", "mlt", "cloud", "stac"]
frontend = ["rust-embed"]
postgres = ["deadpool-postgres", "tokio-postgres", "postgres-types", "semver", "dep:ogcapi-types", "dep:geojson", "dep:cql2"]
postgres-integration = ["postgres"]
raster = ["gdal", "dep:ndarray", "dep:exmex"]
cloud = ["object_store", "url"]
mlt = ["mlt-core", "dep:prost", "geo-types"]
geoparquet = ["dep:parquet", "dep:arrow-array", "dep:arrow-schema", "dep:arrow-cast", "dep:geo", "dep:prost"]
duckdb = ["dep:duckdb", "dep:prost"]
stac = ["raster", "dep:stac"]
# MCP server (stdio + Streamable HTTP). Opt-in to keep default builds slim
# and avoid pulling rmcp into every `cargo build` invocation.
mcp = [
  "dep:rmcp",
  "dep:schemars",
  "dep:base64",
  "dep:jsonwebtoken",
  "dep:askama",
  "dep:serde_urlencoded",
  "dep:rsa",
]
# Disk-backed SQLite persistence for the MCP OAuth store (registered
# clients, outstanding authorization codes, refresh tokens). Without this
# feature the store is purely in-memory and a server restart invalidates
# every issued token. Requires `mcp`. Reuses the non-optional `rusqlite`
# dep declared for MBTiles — no extra build-time cost beyond compiling
# `src/mcp/auth_store_sqlite.rs`.
mcp-persistence = ["mcp"]

[dev-dependencies]
tower            = { workspace = true }
axum-test        = { workspace = true }
tempfile         = { workspace = true }
insta            = { workspace = true }
criterion        = { workspace = true }
url              = { workspace = true }
base64           = { version = "0.22" }
sha2             = { workspace = true }
serde_urlencoded = "0.7"
jsonwebtoken     = { version = "10", default-features = false, features = ["rust_crypto", "use_pem"] }

